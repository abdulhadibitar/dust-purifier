<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dust Purifier Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    header { background: #1e293b; padding: 20px; text-align: center; border-bottom: 2px solid #334155; }
    header h1 { font-size: 1.8em; color: #38bdf8; }
    header p  { color: #94a3b8; font-size: 0.9em; margin-top: 4px; }
    .cards { display: flex; flex-wrap: wrap; gap: 16px; padding: 24px; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; min-width: 180px; flex: 1; max-width: 220px; text-align: center; border: 1px solid #334155; }
    .card .label { color: #94a3b8; font-size: 0.85em; margin-bottom: 8px; }
    .card .value { font-size: 2.2em; font-weight: bold; color: #38bdf8; }
    .card .unit  { color: #64748b; font-size: 0.8em; margin-top: 4px; }
    .fan-on  { color: #22c55e !important; }
    .fan-off { color: #ef4444 !important; }
    .charts { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 24px 24px; }
    .chart-box { background: #1e293b; border-radius: 16px; padding: 20px; flex: 1; min-width: 300px; border: 1px solid #334155; }
    .chart-box h3 { color: #94a3b8; font-size: 0.95em; margin-bottom: 16px; }
    .status { text-align: center; padding: 10px; color: #64748b; font-size: 0.85em; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>

<header>
  <h1>🌬️ Dust Purifier Dashboard</h1>
  <p><span class="dot"></span>Live data — updates every 15 seconds</p>
</header>

<div class="cards">
  <div class="card">
    <div class="label">Dust Level</div>
    <div class="value" id="dust">--</div>
    <div class="unit">mg/m³</div>
  </div>
  <div class="card">
    <div class="label">Temperature</div>
    <div class="value" id="temp">--</div>
    <div class="unit">°C</div>
  </div>
  <div class="card">
    <div class="label">Humidity</div>
    <div class="value" id="hum">--</div>
    <div class="unit">%</div>
  </div>
  <div class="card">
    <div class="label">Fan Status</div>
    <div class="value" id="fan">--</div>
    <div class="unit">auto controlled</div>
  </div>
</div>

<div class="charts">
  <div class="chart-box">
    <h3>Dust Level Over Time</h3>
    <canvas id="dustChart"></canvas>
  </div>
  <div class="chart-box">
    <h3>Temperature & Humidity Over Time</h3>
    <canvas id="envChart"></canvas>
  </div>
</div>

<div class="status" id="status">Fetching data...</div>

<script>
  const CHANNEL_ID  = "3366456";
  const READ_API    = "B557M372XV9I4ZKN";
  const URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API}&results=20`;

  // Charts setup
  const dustChart = new Chart(document.getElementById('dustChart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Dust (mg/m³)',
        data: [],
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56,189,248,0.1)',
        fill: true,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#94a3b8' } } },
      scales: {
        x: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
        y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } }
      }
    }
  });

  const envChart = new Chart(document.getElementById('envChart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {
          label: 'Temperature (°C)',
          data: [],
          borderColor: '#f97316',
          backgroundColor: 'rgba(249,115,22,0.1)',
          fill: true,
          tension: 0.4
        },
        {
          label: 'Humidity (%)',
          data: [],
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34,197,94,0.1)',
          fill: true,
          tension: 0.4
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#94a3b8' } } },
      scales: {
        x: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
        y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } }
      }
    }
  });

  function formatTime(ts) {
    const d = new Date(ts);
    return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  async function fetchData() {
    try {
      const res  = await fetch(URL);
      const data = await res.json();
      const feeds = data.feeds;
      if (!feeds || feeds.length === 0) return;

      const latest = feeds[feeds.length - 1];
      const dustVal = parseFloat(latest.field1) || 0;
      const tempVal = parseFloat(latest.field2) || 0;
      const humVal  = parseFloat(latest.field3) || 0;
      const fanVal  = parseInt(latest.field4)   || 0;

      // Update cards
      document.getElementById('dust').textContent = dustVal.toFixed(4);
      document.getElementById('temp').textContent = tempVal.toFixed(1);
      document.getElementById('hum').textContent  = humVal.toFixed(1);
      const fanEl = document.getElementById('fan');
      fanEl.textContent = fanVal === 1 ? 'ON' : 'OFF';
      fanEl.className = 'value ' + (fanVal === 1 ? 'fan-on' : 'fan-off');

      // Update charts
      const labels = feeds.map(f => formatTime(f.created_at));
      const dusts  = feeds.map(f => parseFloat(f.field1) || 0);
      const temps  = feeds.map(f => parseFloat(f.field2) || 0);
      const hums   = feeds.map(f => parseFloat(f.field3) || 0);

      dustChart.data.labels = labels;
      dustChart.data.datasets[0].data = dusts;
      dustChart.update();

      envChart.data.labels = labels;
      envChart.data.datasets[0].data = temps;
      envChart.data.datasets[1].data = hums;
      envChart.update();

      document.getElementById('status').textContent =
        'Last updated: ' + new Date(latest.created_at).toLocaleTimeString();

    } catch(e) {
      document.getElementById('status').textContent = 'Error fetching data';
    }
  }

  fetchData();
  setInterval(fetchData, 15000);
</script>

</body>
</html>
